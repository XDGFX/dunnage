# PROTOTYPE for #160: a printer profile, second draft. User data, not built into the tool. Throwaway.
#
# The tool needs one thing from a printer: what fits on it. Pick a preset from the tool's
# library of common printers, or type the bed in yourself.
format: printer/0.2
preset: bambu-p1s          # fills in the bed; delete it and set bed by hand for anything else
bed: [256, 256, 256]       # usable x, y, z in mm. Holders bigger than this are split or flagged.

# Optional, defaults shown. Change only if your prints need it.
# clearance: 0.3           # added per side where printed walls meet an item
# colour: black            # only for drawing the preview
